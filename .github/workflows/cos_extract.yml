name: Extract COUI AppCompat Framework from Firmware

on:
  workflow_dispatch:
    inputs:
      firmware_url:
        description: 'Direct URL / GDrive URL to Oplus/Realme/OnePlus Firmware'
        required: true
        type: string
      commit_message:
        description: 'Custom Commit Message'
        required: false
        default: 'feat(cos_extras): extract COUI AppCompat from remote firmware'
        type: string

permissions:
  contents: write

jobs:
  extract-coui:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 erofs-utils unzip python3-pip android-sdk-libsparse-utils p7zip-full
          pip3 install gdown
          wget https://github.com/ssut/payload-dumper-go/releases/download/1.3.0/payload-dumper-go_1.3.0_linux_amd64.tar.gz
          tar -xvf payload-dumper-go_1.3.0_linux_amd64.tar.gz
          sudo mv payload-dumper-go /usr/local/bin/
          wget https://raw.githubusercontent.com/whyshhnuv/lpunpack-lpmake-mirror/Linux-debian/binary/lpunpack
          sudo mv lpunpack /usr/local/bin/
          sudo chmod +x /usr/local/bin/lpunpack

      - name: Extract COUI Framework
        run: |
          chmod +x scripts/extract_coui.sh
          ./scripts/extract_coui.sh "${{ github.event.inputs.firmware_url }}"

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add all extracted files from cos_extras
          git add cos_extras/ || true
          
          if [ -f extracted_metadata.env ]; then
            source extracted_metadata.env
            MSG="feat(cos_extras): extract COUI AppCompat [$MODEL | Android $ANDROID_VER]"
          else
            MSG="${{ github.event.inputs.commit_message }}"
          fi
          
          git commit -m "$MSG" || echo "No changes to commit"
          git push origin main  # adjust branch if needed
