name: Update Dynamic Status

on:
  schedule:
    - cron: '0 * * * *' # Every Hour setups thresholds configurations
  workflow_dispatch: # Manual triggers Node startups triggers

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run update script
        run: python3 update_readme.py
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: sync dynamic support table [skip ci]" || echo "No changes to commit"
          git push
