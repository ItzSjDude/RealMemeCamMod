name: Extract Gallery APK from Firmware

on:
  workflow_dispatch:
    inputs:
      firmware_url:
        description: 'Direct URL / GDrive URL to Oplus/Realme/OnePlus Firmware'
        required: true
        type: string
      commit_message:
        description: 'Custom Commit Message'
        required: false
        default: 'feat(apps): update OplusPhotos.apk from remote firmware'
        type: string

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 erofs-utils unzip python3-pip
          pip3 install gdown
          # Install payload-dumper-go (v1.3.0)
          wget https://github.com/ssut/payload-dumper-go/releases/download/1.3.0/payload-dumper-go_1.3.0_linux_amd64.tar.gz
          tar -xvf payload-dumper-go_1.3.0_linux_amd64.tar.gz
          sudo mv payload-dumper-go /usr/local/bin/
          chmod +x scripts/extract_gallery.sh

      - name: Run Extraction Script
        run: |
          ./scripts/extract_gallery.sh "${{ github.event.inputs.firmware_url }}"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Github Action"
          git config --global user.email "action@github.com"
          git add apps/OplusPhotos/OplusPhotos.apk
          git commit -m "${{ github.event.inputs.commit_message }}" || echo "No changes to commit"
          git push origin 7pro
